<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src 'self'">
<title>Plateforme éducative</title>
<style>
  :root { --bleu: #3158D5; --fond: #F5F7FC; --texte: #1F2A44; --gris: #606B80; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--fond);
         font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: var(--texte); }
  main { max-width: 440px; padding: 32px 24px; text-align: center; }
  img { width: 88px; height: 88px; border-radius: 22px; }
  h1 { font-size: 22px; margin: 18px 0 8px; }
  p { color: var(--gris); line-height: 1.5; margin: 0 0 22px; }
  button { background: var(--bleu); color: #fff; border: 0; border-radius: 14px; padding: 14px 26px;
           font-size: 16px; font-weight: 700; cursor: pointer; }
  button:hover { filter: brightness(1.08); }
</style>
</head>
<body>
<main>
  <img src="icone.png" alt="">
  <h1>Pas de connexion internet</h1>
  <p>L’application a besoin d’internet pour ouvrir vos cours et enregistrer vos progrès.
     Vérifiez le Wi-Fi ou les données mobiles, puis réessayez.</p>
  <button id="reessayer" type="button">Réessayer</button>
</main>
<script>
  const site = "https://nikaisedoua-source.github.io/plateforme-educative-public/";
  document.getElementById("reessayer").addEventListener("click", () => { location.href = site; });
  window.addEventListener("online", () => { location.href = site; });
</script>
</body>
</html>
