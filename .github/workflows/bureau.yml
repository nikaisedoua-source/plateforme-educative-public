# Construit gratuitement l'application de bureau (Windows, Mac, Linux) sur les machines de GitHub
# et la dépose dans une « Release » du dépôt public. Déclenché par un tag bureau-v* (publier_bureau.sh).
# Applications non signées (pas de certificat payant) : Windows et Mac demandent une confirmation au
# premier lancement, expliquée sur la page Télécharger du site.
name: Applications de bureau
on:
  push:
    tags: ["bureau-v*"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: bureau
  cancel-in-progress: false
jobs:
  construire:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    defaults:
      run:
        working-directory: bureau
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - run: npx electron-builder --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v4
        with:
          name: bureau-${{ matrix.os }}
          path: |
            bureau/dist/Plateforme-educative-*.exe
            bureau/dist/Plateforme-educative-*.dmg
            bureau/dist/Plateforme-educative-*.AppImage
            bureau/dist/Plateforme-educative-*.deb
          if-no-files-found: error
  publier:
    needs: construire
    if: startsWith(github.ref, 'refs/tags/bureau-v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: ls -la dist
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --latest \
            --title "Application de bureau (${TAG#bureau-v})" \
            --notes "Application de la plateforme éducative pour Windows, Mac et Linux. Elle ouvre le site en ligne : mêmes comptes, mêmes cours. Page de téléchargement et aide au premier lancement : https://nikaisedoua-source.github.io/plateforme-educative-public/telecharger.html"
