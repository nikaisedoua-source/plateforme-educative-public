<!DOCTYPE html>
<html lang="fr">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Espace élève et administration de la plateforme éducative.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Plateforme éducative">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png">
  <title>Plateforme éducative</title>
  <link rel="manifest" href="manifest.json">
  <!-- KaTeX 0.16.11 (licence MIT), copié dans le projet : formules composées comme dans un document imprimé. -->
  <link rel="stylesheet" href="katex/katex.min.css">
  <style>
    /* Polices du projet (licence OFL) pour les énoncés affichés en HTML/MathML. */
    @font-face { font-family: "Nunito"; font-weight: 400; src: url("assets/fonts/Nunito_400Regular.ttf"); }
    @font-face { font-family: "Nunito"; font-weight: 700; src: url("assets/fonts/Nunito_700Bold.ttf"); }
    @font-face { font-family: "Nunito"; font-weight: 800; src: url("assets/fonts/Nunito_800ExtraBold.ttf"); }
    body { background: #F5F7FF; }
    @media (prefers-color-scheme: dark) { body { background: #151A2E; } }
    math-field::part(menu-toggle) { display: none; }
    .katex { font-size: 1.12em; }
    .katex-display { margin: .6em 0; overflow-x: auto; overflow-y: hidden; }
  </style>
</head>
<body>
  <!-- MathLive (licence MIT), copié dans le projet : saisie des réponses mathématiques sans internet. -->
  <script src="mathlive/mathlive.min.js"></script>
  <script src="katex/katex.min.js"></script>
  <script>
    // Compose les formules (span.tex, LaTeX dans data-tex) ; en cas d'échec le MathML du serveur reste affiché.
    window.composeMath = function (root) {
      if (!window.katex) return;
      root.querySelectorAll("span.tex[data-tex]").forEach(function (el) {
        try {
          var html = katex.renderToString(el.getAttribute("data-tex"), {
            displayMode: el.getAttribute("data-display") === "1", throwOnError: true, output: "html",
            strict: "ignore", trust: false
          });
          el.innerHTML = html;
          el.removeAttribute("data-tex");
        } catch (e) { /* formule non reconnue par KaTeX : MathML conservé */ }
      });
    };
  </script>
  <script>
    // Réglages appliqués une fois la page prête (MathLive a besoin de document.body).
    (function () {
      var M = window.MathfieldElement || (window.MathLive && window.MathLive.MathfieldElement);
      if (!M) return;
      M.fontsDirectory = "fonts/"; // relatif au script mathlive.min.js
      M.soundsDirectory = null;
      M.keypressSound = null;
      M.plonkSound = null;
      M.locale = "fr";
      M.decimalSeparator = ",";
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
