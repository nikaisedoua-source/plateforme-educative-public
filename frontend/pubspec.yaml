name: plateforme_educative_frontend
description: Interface Flutter Web locale de la plateforme éducative.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.1.0
  http: ^1.3.0
  web: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: Nunito
      fonts:
        - asset: fonts/Nunito_400Regular.ttf
        - asset: fonts/Nunito_600SemiBold.ttf
          weight: 600
        - asset: fonts/Nunito_700Bold.ttf
          weight: 700
        - asset: fonts/Nunito_800ExtraBold.ttf
          weight: 800
        - asset: fonts/Nunito_900Black.ttf
          weight: 900
    - family: Baloo 2
      fonts:
        - asset: fonts/Baloo2_600SemiBold.ttf
          weight: 600
        - asset: fonts/Baloo2_700Bold.ttf
          weight: 700
        - asset: fonts/Baloo2_800ExtraBold.ttf
          weight: 800
